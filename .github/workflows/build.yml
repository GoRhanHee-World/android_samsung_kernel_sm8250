name: Kernel builder

on:
  workflow_call:
    inputs:
      device:
        type: string
        required: true
      device_name:
        type: string
        required: true

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.date.outputs.build_date }}
    steps:
      - name: Choose a shared build date for both modes
        id: date
        env:
          TZ: America/Sao_Paulo
        run: echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

  build-kernel:
    name: ${{ inputs.device_name }} (${{ matrix.build_mode }})
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_mode: [stock, ksu]

    env:
      DEVICE: ${{ inputs.device }}
      BUILD_MODE: ${{ matrix.build_mode }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu zstd

      - name: Restore Clang toolchain cache
        id: clang-cache
        uses: actions/cache/restore@v5
        with:
          path: tc/clang
          key: neutron-clang-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/download_clang.sh') }}

      - name: Ensure Clang toolchain is ready
        run: bash scripts/download_clang.sh "$GITHUB_WORKSPACE/tc/clang"

      - name: Save Clang toolchain cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tc/clang
          key: ${{ steps.clang-cache.outputs.cache-primary-key }}

      - name: Run build script
        id: build
        run: |
          start_time=$SECONDS
          ./build.sh
          duration=$((SECONDS - start_time))
          echo "duration=$((duration / 60))m $((duration % 60))s" >> "$GITHUB_OUTPUT"

      - name: Prepare build bundle
        env:
          BUILD_DURATION: ${{ steps.build.outputs.duration }}
        run: |
          shopt -s nullglob
          zip_files=(not-"$BUILD_MODE"-*-"$DEVICE".zip)
          if [ "${#zip_files[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP for $DEVICE ($BUILD_MODE)." >&2
            exit 1
          fi
          zip_file=${zip_files[0]}
          mkdir -p bundle
          cp "$zip_file" bundle/

          clang_version=$(tc/clang/bin/clang --version | head -n1)
          ksu_version=Disabled
          if grep -qx 'CONFIG_KSU=y' out/.config; then
            ksu_number=$(awk -F 'KSU_VERSION=' '/-DKSU_VERSION=[0-9]+/ { sub(/[^0-9].*$/, "", $2); print $2; exit }' KernelSU/kernel/Makefile)
            ksu_tag=$(awk -F '"' '/-DKSU_VERSION_TAG=/ { gsub(/\\/, "", $2); print $2; exit }' KernelSU/kernel/Makefile)
            ksu_tag=${ksu_tag:-$(git -C KernelSU describe --tags --always)}
            ksu_version="${ksu_number:-Unknown} / $ksu_tag"
          fi
          susfs_version="Not included"
          if grep -qx 'CONFIG_KSU_SUSFS=y' out/.config; then
            susfs_version=$(awk -F '"' '/^#define SUSFS_VERSION / { print $2; exit }' include/linux/susfs.h)
            susfs_version=${susfs_version:-Unknown}
          fi
          selinux=Enforcing
          if ! grep -qx 'CONFIG_SECURITY_SELINUX=y' out/.config; then
            selinux=Disabled
          elif grep -qx 'CONFIG_SECURITY_SELINUX_PERMISSIVE=y' out/.config; then
            selinux=Permissive
          fi
          cat > "bundle/release-notes-$BUILD_MODE.md" <<EOF
          Clang version: $clang_version
          Build Date: $(date -d "$BUILD_DATE" '+%d %B %Y')
          Device: $DEVICE
          Build mode: $BUILD_MODE
          KernelSU version: $ksu_version
          SusFS version: $susfs_version
          SELinux: $selinux
          Commit: $(git rev-parse --short=8 HEAD)
          Build completed in: $BUILD_DURATION
          EOF

      - name: Upload temporary build bundle
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.device }}-${{ matrix.build_mode }}
          path: bundle/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish ${{ inputs.device_name }} (stock + ksu)
    needs: [prepare, build-kernel]
    runs-on: ubuntu-24.04
    env:
      DEVICE: ${{ inputs.device }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - name: Download both build bundles
        uses: actions/download-artifact@v8
        with:
          pattern: build-${{ inputs.device }}-*
          path: bundles
          merge-multiple: true

      - name: Validate both modes and combine release notes
        id: release
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release
          for mode in stock ksu; do
            zip_files=(bundles/not-"$mode"-"$BUILD_DATE"-*-"$DEVICE".zip)
            if [ "${#zip_files[@]}" -ne 1 ] || [ ! -s "bundles/release-notes-$mode.md" ]; then
              echo "Expected one ZIP and release notes for $DEVICE ($mode)." >&2
              exit 1
            fi
            cp "${zip_files[0]}" release/
            {
              echo "### $mode"
              echo
              cat "bundles/release-notes-$mode.md"
              echo
            } >> release-notes.md
          done
          {
            echo "tag=$DEVICE-$BUILD_DATE"
            echo "title=$DEVICE - $(date -d "$BUILD_DATE" '+%Y-%m-%d')"
          } >> "$GITHUB_OUTPUT"

      - name: Upload device artifact containing both kernel ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.device }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Publish kernel release with both modes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded ZIPs and temporary build bundles
        uses: actions/github-script@v8
        env:
          DEVICE: ${{ inputs.device }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const currentZIPs = new Set(fs.readdirSync('release'));
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of assets) {
              const isKernelZIP = ['stock', 'ksu'].some(mode => asset.name.startsWith(`not-${mode}-`))
                && asset.name.endsWith(`-${process.env.DEVICE}.zip`);
              if (isKernelZIP && !currentZIPs.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo,
                  asset_id: asset.id,
                });
              }
            }
            const names = new Set(['stock', 'ksu'].map(mode => `build-${process.env.DEVICE}-${mode}`));
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (names.has(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                });
              }
            }
