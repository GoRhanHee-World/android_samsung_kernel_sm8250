name: Kernel builder

on:
  workflow_call:
    inputs:
      device:
        type: string
        required: true
      device_name:
        type: string
        required: true
      build_mode:
        type: string
        default: ksu

permissions:
  contents: read

jobs:
  build-kernel:
    name: ${{ inputs.device_name }} (${{ inputs.build_mode }})
    runs-on: ubuntu-latest

    env:
      DEVICE: ${{ inputs.device }}
      BUILD_MODE: ${{ inputs.build_mode }}

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run build script
        run: ./build.sh

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.device }}-${{ inputs.build_mode }}
          path: not-${{ inputs.build_mode }}-*-${{ inputs.device }}.zip
          if-no-files-found: error
          compression-level: 0
