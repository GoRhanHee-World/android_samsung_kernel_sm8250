name: IT build for r8q

on:
  workflow_dispatch:
    inputs:
      build_mode:
        type: choice
        required: true
        default: ksu
        options:
          - ksu
          - stock

permissions:
  contents: read

jobs:
  build-r8q:
    uses: ./.github/workflows/build.yml
    with:
      device: r8q
      device_name: Galaxy S20 FE
      build_mode: ${{ inputs.build_mode }}
