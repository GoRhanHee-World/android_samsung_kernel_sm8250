name: Build for Galaxy S20 series

on:
  workflow_dispatch:
    inputs:
      build_mode:
        type: choice
        required: true
        default: ksu
        options:
          - ksu
          - stock

permissions:
  contents: read

jobs:
  build-s20:
    name: Build ${{ matrix.device }} (${{ inputs.build_mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: x1q
            device_name: Galaxy S20
          - device: y2q
            device_name: Galaxy S20+
          - device: z3q
            device_name: Galaxy S20 Ultra
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device }}
      device_name: ${{ matrix.device_name }}
      build_mode: ${{ inputs.build_mode }}
